<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#071F19" />
  <meta name="robots" content="noindex" />
  <title>ShareLoc · Live vehicle location</title>
  <link rel="icon" href="/static/mark.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="/static/track.css" />
  <script>/*__BOOTSTRAP__*/</script>
</head>
<body>
  <div id="map" role="application" aria-label="Live vehicle map"></div>
  <div class="vignette" id="vignette" aria-hidden="true"></div>

  <header class="hud-top">
    <div class="brand">
      <img src="/static/mark.svg" alt="" width="40" height="40" />
      <div>
        <div class="brand-name">ShareLoc</div>
        <div class="brand-sub" id="vehicleId">Live vehicle location</div>
      </div>
    </div>
    <div class="status-pill" id="statusPill" data-status="waiting">
      <span class="dot"></span>
      <span class="status-text" id="statusText">Connecting…</span>
      <span class="status-age" id="statusAge"></span>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <nav class="controls" aria-label="Map controls">
    <button class="ctl active" id="btnFollow" title="Follow vehicle" aria-pressed="true">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="currentColor"/><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 1.5v4M12 18.5v4M1.5 12h4M18.5 12h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <button class="ctl" id="btnHeading" title="Heading-up view" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M12 2.5 17 21l-5-3.6L7 21z" fill="currentColor"/></svg>
    </button>
    <button class="ctl" id="btnFit" title="Show whole trip">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18c3-6 6 2 9-4s4-7 7-9"/><circle cx="4" cy="18" r="1.8" fill="currentColor"/><circle cx="20" cy="5" r="1.8" fill="currentColor"/></svg>
    </button>
    <div class="ctl-group">
      <button class="ctl" id="btnZoomIn" title="Zoom in"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg></button>
      <button class="ctl" id="btnZoomOut" title="Zoom out"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 12h12"/></svg></button>
    </div>
  </nav>

  <button class="recenter" id="btnRecenter" hidden>
    <svg viewBox="0 0 24 24"><path d="M12 2.5 17 21l-5-3.6L7 21z" fill="currentColor"/></svg>
    Re-centre on vehicle
  </button>

  <section class="nav-card" id="navCard" hidden>
    <div class="nav-head">
      <span class="nav-eyebrow">Arriving</span>
      <span class="nav-eta" id="navEta">—</span>
    </div>
    <div class="nav-name" id="navName">Destination</div>
    <div class="nav-address" id="navAddress"></div>
    <div class="nav-row">
      <span class="nav-remaining" id="navRemaining">—</span>
      <span class="nav-soc" id="navSoc" hidden></span>
    </div>
    <div class="nav-charging" id="navCharging" hidden></div>
  </section>

  <section class="panel" id="panel" data-over="none">
    <div class="panel-main">
      <div class="speed">
        <div class="speed-label">Current speed</div>
        <div class="speed-row">
          <span class="speed-value" id="speedValue">—</span>
          <span class="speed-unit">km/h</span>
        </div>
        <div class="road" id="roadName">Waiting for the first position…</div>
        <div class="address" id="address"></div>
      </div>
      <div class="limit" id="limitSign" hidden>
        <span id="limitValue">50</span>
        <small>limit</small>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><span class="stat-label">Distance</span><span class="stat-value" id="statDistance">—</span></div>
      <div class="stat"><span class="stat-label">Avg speed</span><span class="stat-value" id="statAvg">—</span></div>
      <div class="stat"><span class="stat-label">Max speed</span><span class="stat-value" id="statMax">—</span></div>
      <div class="stat"><span class="stat-label">Duration</span><span class="stat-value" id="statDuration">—</span></div>
    </div>
    <div class="panel-footer">
      <span class="coords" id="coords"></span>
      <button class="link-btn" id="btnCopy">Copy link</button>
    </div>
  </section>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="/static/track.js" defer></script>
</body>
</html>
